<style>

body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif;background:radial-gradient(1000px 480px at 50% -10%,#2a1416 0,var(--bg) 62%) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

.f input{border:0;background:none;padding:12px 0}input:focus,select:focus,textarea:focus,.f:focus-within{border-color:var(--ac)}
textarea{min-height:70px;resize:vertical}

.btn.w{width:100%;padding:14px;margin-top:16px;font-size:16px}
.ib{background:none;border:0;color:var(--mu);cursor:pointer;padding:4px}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg .btn{flex:1}.seg .btn:not(.on){background:transparent;border:1px solid var(--bd);color:var(--mu)}
.err{color:var(--al);font-weight:600;min-height:20px;margin:10px 0 0;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.st svg{color:var(--al)}
.st b{display:block;font:700 30px 'Barlow Condensed';margin-top:4px}.st span{font-size:13px;color:var(--mu)}
.pr,.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card)}
.pr{cursor:pointer}.pr:hover{border-color:var(--ac)}

.row{display:flex;gap:8px;flex-wrap:wrap}.row>input{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}.grid div span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.big{font:700 40px 'Barlow Condensed';color:var(--tx)}.bar{height:8px;background:var(--in);border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
label.ck{display:flex;gap:10px;align-items:center;padding:7px 0}label.ck input{width:auto}
.tl{position:relative;height:22px;margin:10px 0 4px}.tln{position:absolute;top:10px;left:0;right:0;height:2px;background:var(--bd)}
.dot,.now{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;margin-left:-6px;background:var(--mu)}.now{background:var(--ac);border:2px solid var(--tx);top:3px;width:16px;height:16px;margin-left:-8px}
.tls{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font:600 12px Barlow;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}td.n{white-space:normal;min-width:180px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.md{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font:700 20px 'Barlow Condensed';text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:6px}#tabs .btn{padding:10px 2px;font-size:14px}.unread{border-color:var(--ac)}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
</style></head><body><main id="app"></main>

const isAdmin=()=>(me?.email||'').toLowerCase()==='malvirngomo8@gmail.com';
function notify(pid){
 modal('Notify patient',`<label class="l">Type</label><select name="kind">${KINDS.map(k=>`<option value="${k[0]}">${k[1]}</option>`).join('')}</select><label class="l">Priority</label><select name="priority"><option value="routine">Routine</option><option value="important">Important</option><option value="urgent">Urgent</option></select>${fld('Title','title','text','','required maxlength="200"')}<label class="l">Details</label><textarea name="body" maxlength="2000"></textarea>`,async f=>{
  const {error}=await sb.from('notifications').insert({patient_id:pid,kind:f.kind,priority:f.priority,title:f.title.trim(),body:nz(f.body)});if(error)throw error})}
function staffPanel(){
 if(!isAdmin())return '';
 return `<h2>Doctors and midwives</h2><div class="mu" style="margin-bottom:8px">Add an email here, then that person registers as Doctor / Midwife with the same email.</div>${D.se.map(x=>`<div class="li"><div>${esc(x.email)} <span class="pill">${x.title}</span></div>${x.email.toLowerCase()===me.email.toLowerCase()?'':`<button class="btn g" onclick="rmStaff('${esc(x.email)}')">${ic('x')} Remove</button>`}</div>`).join('')}<div class="row"><input id="se" type="email" placeholder="staff@email.com"><select id="st" style="width:auto"><option>Doctor</option><option>Midwife</option></select><button class="btn" onclick="addStaff()">${ic('plus')} Add</button></div>`}
async function addStaff(){const e=$('se').value.trim().toLowerCase();if(!e)return;const {error}=await sb.from('staff_emails').insert({email:e,title:$('st').value});if(error)return alert(error.message);loadDoc()}
async function rmStaff(e){if(!confirm('Remove '+e+'? Their existing account keeps its access.'))return;await sb.from('staff_emails').delete().eq('email',e);loadDoc()}
boot();
</script></body></html>
