async function submitAuth(){
 const em=$('em').value.trim(),pw=$('pw').value,m=$('msg');m.textContent='';
 if(!em||pw.length<8)return m.textContent='Enter your email and a password of at least 8 characters.';
 if(mode==='reg'){
  const fn=$('fn').value.trim(),pat=role==='patient',w=pat?+$("wks").value:0;
  if(!fn||(pat&&!(w>=1&&w<=40)))return m.textContent='Fill in every field. Weeks must be 1 to 40.';
  const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:fn,phone:pat?$('ph').value.trim():'',weeks:pat?w:'',wants:role}}});
  if(error)return m.textContent=error.message;
  if(!data.session){mode='login';return authView('Account created. Check your email to confirm it, then log in.')}
 }else{const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return m.textContent=error.message}

async function loadSlots(){

 el.innerHTML='<div class="mu" style="margin-top:8px">Loading times...</div>';

 if(!$('slots'))return;if(error){el.innerHTML='<div class="err">'+esc(error.message)+'</div>';return}
 const taken=(data||[]).map(ft),n=new Date(),isT=bk.date===today(),sl=[];
 for(let m=0;m<=1410;m+=30){const x=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');if(taken.includes(x)||(isT&&m<=n.getHours()*60+n.getMinutes()))continue;sl.push(x)}
 el.innerHTML=sl.length?`<label class="l">Available times</label><div class="slots">${sl.map(x=>`<button type="button" class="btn ${bk.time===x?'':'g'}" onclick="bk.time='${x}';drawPt()">${x}</button>`).join('')}</div>${bk.time?`<button class="btn w" onclick="confirmBook()">${ic('check')} ${bk.id?'Confirm new time':'Confirm booking'}</button>`:''}`:'<div class="mu" style="margin-top:8px">No free times on this date. Try another day.</div>'}

function afterChat(){paintChat();markThread(me.role==='doctor'?chatPt:me.id)}
async function markThread(pid){
 const st=me.role==='doctor',un=CH.msgs.filter(m=>m.patient_id===pid&&!m.read&&(st?m.sender_id===pid:m.sender_id!==me.id));if(!un.length)return;
 un.forEach(m=>m.read=true);refreshNav();
 let q=sb.from('chat_messages').update({read:true}).eq('patient_id',pid).eq('read',false);q=st?q.eq('sender_id',pid):q.neq('sender_id',me.id);await q}
function onChat(pl){
 const m=pl.new;if(!m||!me)return;
 if(pl.eventType==='UPDATE'){const x=CH.msgs.find(y=>y.id===m.id);if(x)x.read=m.read;refreshNav();return}
 if(CH.msgs.some(y=>y.id===m.id))return;CH.msgs.push(m);
 const pid=m.patient_id,st=me.role==='doctor',viewing=st?(view==='chat'&&chatPt===pid&&!sel):ptab==='chat';
 if(viewing){paintChat();if(m.sender_id!==me.id)markThread(pid)}
 else{if(st&&m.sender_id===pid)toast('New message from '+nm2(pid),()=>openChat(pid));refreshNav();if(st&&view==='chat'&&!chatPt&&!sel)drawDoc()}}
async function sendChat(){
 const i=$('cin');if(!i)return;const body=i.value.trim(),pid=me.role==='doctor'?chatPt:me.id;if(!body||!pid)return;i.value='';
 const {data,error}=await sb.from('chat_messages').insert({patient_id:pid,sender_id:me.id,body}).select().single();
 if(error){i.value=body;return alert(error.message)}
 if(!CH.msgs.some(y=>y.id===data.id))CH.msgs.push(data);paintChat();i.focus()}
/* ---------- voice and video calls (WebRTC, signalling through the database) ---------- */
let CALL=null,incoming=null,sigQ=Promise.resolve(),ringT=null,actx=null;
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const sig=(kind,payload,c=CALL)=>sb.from('call_signals').insert({patient_id:c.pid,call_id:c.id,sender_id:me.id,kind,payload:payload||null});
async function iceCfg(){try{const {data}=await sb.from('app_settings').select('value').eq('key','ice_servers').maybeSingle();if(data&&Array.isArray(data.value)&&data.value.length)return data.value}catch(e){}return [{urls:'stun:stun.l.google.com:19302'}]}
async function getMedia(){try{CALL.local=await navigator.mediaDevices.getUserMedia({audio:true,video:CALL.video?{facingMode:'user'}:false})}catch(e){if(CALL.video){CALL.video=false;CALL.local=await navigator.mediaDevices.getUserMedia({audio:true})}else throw e}}
async function makePc(){
 const pc=new RTCPeerConnection({iceServers:await iceCfg()});CALL.pc=pc;CALL.pend=[];
 CALL.local.getTracks().forEach(t=>pc.addTrack(t,CALL.local));
 pc.ontrack=e=>{const v=$('rv');if(v&&v.srcObject!==e.streams[0])v.srcObject=e.streams[0];if(CALL&&!CALL.start){CALL.state='connected';CALL.start=Date.now();CALL.tick=setInterval(()=>{const c=$('cst');if(c&&CALL)c.textContent=fmtT(Math.round((Date.now()-CALL.start)/1000))},1000)}};
 pc.onicecandidate=e=>{if(e.candidate&&CALL)sig('ice',{c:e.candidate.toJSON()})};
 pc.onconnectionstatechange=()=>{const c=$('cst');if(!c||!CALL)return;if(pc.connectionState==='failed')c.textContent='Connection failed. Try again on a better network.';if(pc.connectionState==='disconnected')c.textContent='Reconnecting...'}}
function callUI(peer,status){
 closeCallUI();const d=document.createElement('div');d.className='call';d.id='callui';
 d.innerHTML=`<video id="rv" autoplay playsinline></video>${CALL.video?'<video id="lv" autoplay muted playsinline></video>':''}<div class="cs"><b>${esc(peer)}</b><div id="cst">${status}</div></div><div class="cc"><button class="cb" id="bm" onclick="togTrack('audio','bm')">${ic('mic')}</button>${CALL.video?`<button class="cb" id="bv" onclick="togTrack('video','bv')">${ic('video')}</button>`:''}<button class="cb end" onclick="endCall('me')">${ic('phoneoff')}</button></div>`;
 document.body.appendChild(d);if(CALL.video&&$('lv'))$('lv').srcObject=CALL.local}
function closeCallUI(){const d=$('callui');if(d)d.remove()}
function togTrack(kind,btn){if(!CALL||!CALL.local)return;const ts=CALL.local.getTracks().filter(t=>t.kind===kind);const on=!ts.every(t=>t.enabled);ts.forEach(t=>t.enabled=on);$(btn).classList.toggle('off',!on)}
async function startCall(video,pid){
 if(CALL||incoming)return alert('You are already in a call.');
 if(!navigator.mediaDevices||!window.RTCPeerConnection)return alert('Calls are not supported in this browser.');
 pid=pid||me.id;CALL={id:crypto.randomUUID(),pid,role:'caller',video,state:'ringing',peer:me.role==='doctor'?nm2(pid):'Maternity team'};
 try{await getMedia()}catch(e){CALL=null;return alert('Could not use the microphone or camera. Allow access in the browser settings and try again.')}
 callUI(CALL.peer,'Calling...');
 const {error}=await sig('ring',{video:CALL.video,name:myLabel()});if(error){endCall('me',true);return alert(error.message)}
 CALL.timer=setTimeout(()=>{if(CALL&&CALL.state==='ringing')endCall('noanswer')},45000)}
function ringStart(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const b=()=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.4);navigator.vibrate&&navigator.vibrate([300,150,300])};b();ringT=setInterval(b,1800)}catch(e){}}
function ringStop(){clearInterval(ringT);ringT=null}
function showIncoming(){
 hideIncoming(true);const d=document.createElement('div');d.className='call inc';d.id='incui';
 d.innerHTML=`<div class="cb" style="width:96px;height:96px">${ic(incoming.video?'video':'phone')}</div><h1 style="margin:16px 0 4px">${esc(incoming.name||'Incoming call')}</h1><div style="color:#ccc">Incoming ${incoming.video?'video':'voice'} call</div><div class="cc" style="position:static;margin-top:30px"><button class="cb end" onclick="declineCall()">${ic('phoneoff')}</button><button class="cb ok" onclick="acceptCall()">${ic('phone')}</button></div>`;
 document.body.appendChild(d);ringStart();incoming.t=setTimeout(()=>hideIncoming(),45000)}
function hideIncoming(keep){ringStop();const d=$('incui');if(d)d.remove();if(!keep&&incoming){clearTimeout(incoming.t);incoming=null}}
async function acceptCall(){
 const inc=incoming;hideIncoming();if(!inc||CALL)return;
 CALL={id:inc.id,pid:inc.pid,role:'callee',video:inc.video,state:'connecting',peer:inc.name||'Call'};
 try{await getMedia()}catch(e){await sig('decline',null,CALL);CALL=null;return alert('Could not use the microphone or camera. Allow access in the browser settings.')}
 callUI(CALL.peer,'Connecting...');await makePc();await sig('accept')}
async function declineCall(){const inc=incoming;hideIncoming();if(inc)await sig('decline',null,{id:inc.id,pid:inc.pid})}
async function endCall(reason,silent){
 const c=CALL;if(!c)return;CALL=null;clearTimeout(c.timer);clearInterval(c.tick);
 if(reason==='me'||reason==='noanswer'){try{await sig('hangup',null,c)}catch(e){}}
 if(c.pc)c.pc.close();if(c.local)c.local.getTracks().forEach(t=>t.stop());closeCallUI();
 if(c.role==='caller'&&!silent){const dur=c.start?Math.round((Date.now()-c.start)/1000):0,k=c.video?'video':'voice';
  await sb.from('chat_messages').insert({patient_id:c.pid,sender_id:me.id,body:dur?`${k[0].toUpperCase()+k.slice(1)} call \u00b7 ${fmtT(dur)}`:`Missed ${k} call`})}
 if(reason==='declined')alert('The call was declined.');if(reason==='noanswer')alert('No answer. A missed call note was sent in the chat.')}
async function handleSig(r){
 if(!me||r.sender_id===me.id)return;
 if(r.kind==='ring'){if(CALL||incoming)return;incoming={id:r.call_id,pid:r.patient_id,video:!!(r.payload&&r.payload.video),name:r.payload&&r.payload.name};showIncoming();return}
 if(incoming&&r.call_id===incoming.id&&['hangup','accept','decline'].includes(r.kind)){hideIncoming();return}
 if(!CALL||r.call_id!==CALL.id)return;
 if(r.kind==='accept'&&CALL.role==='caller'&&CALL.state==='ringing'){clearTimeout(CALL.timer);CALL.state='connecting';$('cst')&&($('cst').textContent='Connecting...');await makePc();const o=await CALL.pc.createOffer();await CALL.pc.setLocalDescription(o);await sig('offer',{sdp:CALL.pc.localDescription})}
 else if(r.kind==='offer'&&CALL.pc){await CALL.pc.setRemoteDescription(r.payload.sdp);for(const x of CALL.pend.splice(0))await CALL.pc.addIceCandidate(x);const a=await CALL.pc.createAnswer();await CALL.pc.setLocalDescription(a);await sig('answer',{sdp:CALL.pc.localDescription})}
 else if(r.kind==='answer'&&CALL.pc){await CALL.pc.setRemoteDescription(r.payload.sdp);for(const x of CALL.pend.splice(0))await CALL.pc.addIceCandidate(x)}
 else if(r.kind==='ice'&&CALL.pc){if(CALL.pc.remoteDescription)await CALL.pc.addIceCandidate(r.payload.c);else CALL.pend.push(r.payload.c)}
 else if(r.kind==='decline')endCall('declined',false);
 else if(r.kind==='hangup')endCall('remote',false)}
function onSig(pl){if(pl.new)sigQ=sigQ.then(()=>handleSig(pl.new)).catch(e=>console.error(e))}
boot();
</script></body></html>
