let CALL=null,incoming=null,sigQ=Promise.resolve(),ringT=null,actx=null;
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const sig=(kind,payload,c=CALL)=>sb.from('call_signals').insert({patient_id:c.pid,call_id:c.id,sender_id:me.id,kind,payload:payload||null});
async function iceCfg(){try{const {data}=await sb.from('app_settings').select('value').eq('key','ice_servers').maybeSingle();if(data&&Array.isArray(data.value)&&data.value.length)return data.value}catch(e){}return [{urls:'stun:stun.l.google.com:19302'}]}
async function getMedia(){try{CALL.local=await navigator.mediaDevices.getUserMedia({audio:true,video:CALL.video?{facingMode:'user'}:false})}catch(e){if(CALL.video){CALL.video=false;CALL.local=await navigator.mediaDevices.getUserMedia({audio:true})}else throw e}}
async function makePc(){
 const pc=new RTCPeerConnection({iceServers:await iceCfg()});CALL.pc=pc;CALL.pend=[];
 CALL.local.getTracks().forEach(t=>pc.addTrack(t,CALL.local));
 pc.ontrack=e=>{const v=$('rv');if(v&&v.srcObject!==e.streams[0])v.srcObject=e.streams[0];if(CALL&&!CALL.start){CALL.state='connected';CALL.start=Date.now();CALL.tick=setInterval(()=>{const c=$('cst');if(c&&CALL)c.textContent=fmtT(Math.round((Date.now()-CALL.start)/1000))},1000)}};
 pc.onicecandidate=e=>{if(e.candidate&&CALL)sig('ice',{c:e.candidate.toJSON()})};
 pc.onconnectionstatechange=()=>{const c=$('cst');if(!c||!CALL)return;if(pc.connectionState==='failed')c.textContent='Connection failed. Try again on a better network.';if(pc.connectionState==='disconnected')c.textContent='Reconnecting...'}}
function callUI(peer,status){

 d.innerHTML=`<video id="rv" autoplay playsinline></video>${CALL.video?'<video id="lv" autoplay muted playsinline></video>':''}<div class="cs"><b>${esc(peer)}</b><div id="cst">${status}</div></div><div class="cc"><button class="cb" id="bm" onclick="togTrack('audio','bm')">${ic('mic')}</button>${CALL.video?`<button class="cb" id="bv" onclick="togTrack('video','bv')">${ic('video')}</button>`:''}<button class="cb end" onclick="endCall('me')">${ic('phoneoff')}</button></div>`;
 document.body.appendChild(d);if(CALL.video&&$('lv'))$('lv').srcObject=CALL.local}

async function startCall(video,pid){
 if(CALL||incoming)return alert('You are already in a call.');
 if(!navigator.mediaDevices||!window.RTCPeerConnection)return alert('Calls are not supported in this browser.');
 pid=pid||me.id;CALL={id:crypto.randomUUID(),pid,role:'caller',video,state:'ringing',peer:me.role==='doctor'?nm2(pid):'Maternity team'};
 try{await getMedia()}catch(e){CALL=null;return alert('Could not use the microphone or camera. Allow access in the browser settings and try again.')}
 callUI(CALL.peer,'Calling...');
 const {error}=await sig('ring',{video:CALL.video,name:myLabel()});if(error){endCall('me',true);return alert(error.message)}
 CALL.timer=setTimeout(()=>{if(CALL&&CALL.state==='ringing')endCall('noanswer')},45000)}
function ringStart(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const b=()=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.4);navigator.vibrate&&navigator.vibrate([300,150,300])};b();ringT=setInterval(b,1800)}catch(e){}}
function ringStop(){clearInterval(ringT);ringT=null}
function showIncoming(){
 hideIncoming(true);const d=document.createElement('div');d.className='call inc';d.id='incui';
 d.innerHTML=`<div class="cb" style="width:96px;height:96px">${ic(incoming.video?'video':'phone')}</div><h1 style="margin:16px 0 4px">${esc(incoming.name||'Incoming call')}</h1><div style="color:#ccc">Incoming ${incoming.video?'video':'voice'} call</div><div class="cc" style="position:static;margin-top:30px"><button class="cb end" onclick="declineCall()">${ic('phoneoff')}</button><button class="cb ok" onclick="acceptCall()">${ic('phone')}</button></div>`;
 document.body.appendChild(d);ringStart();incoming.t=setTimeout(()=>hideIncoming(),45000)}
function hideIncoming(keep){ringStop();const d=$('incui');if(d)d.remove();if(!keep&&incoming){clearTimeout(incoming.t);incoming=null}}
async function acceptCall(){
 const inc=incoming;hideIncoming();if(!inc||CALL)return;
 CALL={id:inc.id,pid:inc.pid,role:'callee',video:inc.video,state:'connecting',peer:inc.name||'Call'};
 try{await getMedia()}catch(e){await sig('decline',null,CALL);CALL=null;return alert('Could not use the microphone or camera. Allow access in the browser settings.')}

async function endCall(reason,silent){
 const c=CALL;if(!c)return;CALL=null;clearTimeout(c.timer);clearInterval(c.tick);
 if(reason==='me'||reason==='noanswer'){try{await sig('hangup',null,c)}catch(e){}}
 if(c.pc)c.pc.close();if(c.local)c.local.getTracks().forEach(t=>t.stop());closeCallUI();
 if(c.role==='caller'&&!silent){const dur=c.start?Math.round((Date.now()-c.start)/1000):0,k=c.video?'video':'voice';
  await sb.from('chat_messages').insert({patient_id:c.pid,sender_id:me.id,body:dur?`${k[0].toUpperCase()+k.slice(1)} call \u00b7 ${fmtT(dur)}`:`Missed ${k} call`})}
 if(reason==='declined')alert('The call was declined.');if(reason==='noanswer')alert('No answer. A missed call note was sent in the chat.')}
async function handleSig(r){
 if(!me||r.sender_id===me.id)return;
 if(r.kind==='ring'){if(CALL||incoming)return;incoming={id:r.call_id,pid:r.patient_id,video:!!(r.payload&&r.payload.video),name:r.payload&&r.payload.name};showIncoming();return}
 if(incoming&&r.call_id===incoming.id&&['hangup','accept','decline'].includes(r.kind)){hideIncoming();return}
 if(!CALL||r.call_id!==CALL.id)return;
 if(r.kind==='accept'&&CALL.role==='caller'&&CALL.state==='ringing'){clearTimeout(CALL.timer);CALL.state='connecting';$('cst')&&($('cst').textContent='Connecting...');await makePc();const o=await CALL.pc.createOffer();await CALL.pc.setLocalDescription(o);await sig('offer',{sdp:CALL.pc.localDescription})}
 else if(r.kind==='offer'&&CALL.pc){await CALL.pc.setRemoteDescription(r.payload.sdp);for(const x of CALL.pend.splice(0))await CALL.pc.addIceCandidate(x);const a=await CALL.pc.createAnswer();await CALL.pc.setLocalDescription(a);await sig('answer',{sdp:CALL.pc.localDescription})}
 else if(r.kind==='answer'&&CALL.pc){await CALL.pc.setRemoteDescription(r.payload.sdp);for(const x of CALL.pend.splice(0))await CALL.pc.addIceCandidate(x)}
 else if(r.kind==='ice'&&CALL.pc){if(CALL.pc.remoteDescription)await CALL.pc.addIceCandidate(r.payload.c);else CALL.pend.push(r.payload.c)}
 else if(r.kind==='decline')endCall('declined',false);
 else if(r.kind==='hangup')endCall('remote',false)}

  ['bed','Admitted',D.pts.filter(p=>p.admitted_at).length,"nav('patients');pFilter='admitted';drawDoc()"],['alert','Priority patients',D.pts.filter(p=>['critical','priority'].includes(riskOf(p).level)).length,"nav('patients')"],['alert','Open ambulance requests',ambN(),"nav('ambulance')"],
  ['file','Ambulance fees paid','$'+paid,"nav('ambulance')"],['file','Ambulance fees unpaid','$'+owed,"nav('ambulance')"]];
 let h=`<h2 style="margin-top:0">Administrator dashboard</h2><div class="mu" style="margin-bottom:10px">One place to manage staff and who looks after each patient.</div><div class="stats">${st.map(s=>`<div class="st click" role="button" tabindex="0" onclick="${s[3]}">${ic(s[0])}<b>${s[2]}</b><span>${s[1]}</span></div>`).join('')}</div>`;
 h+=`<div class="row" style="margin:14px 0"><button class="btn" onclick="nav('staff')">${ic('plus')} Add or manage staff</button><button class="btn g" onclick="nav('assign')">${ic('user')} Assign patients</button><button class="btn g" onclick="nav('audit')">${ic('shield')} Audit log</button></div>`;
 h+=`<h2>Needs attention</h2>`+(un.length?un.slice(0,8).map(p=>`<div class="pr" onclick="aUn=true;nav('assign')"><div><b>${esc(p.full_name)}</b> <span class="mu">${esc(p.patient_code)}</span><div class="mu">No doctor, midwife or nurse assigned</div></div><span class="pill hot">Assign</span></div>`).join('')+(un.length>8?`<div class="mu">+ ${un.length-8} more</div>`:''):'<div class="mu">Every patient has a care team.</div>');
 const idle=reg.filter(s=>s.active!==false&&s.id!==me.id&&!(D.asg||[]).some(a=>a.staff_id===s.id));
 if(idle.length)h+=`<h3 style="margin:14px 0 6px">Staff with no patients (${idle.length})</h3>`+idle.map(s=>`<div class="pr" onclick="assignPatientsModal('${s.id}')"><div><b>${esc(s.full_name)}</b> <span class="pill">${stTitle(s)}</span></div><span class="pill">Assign patients</span></div>`).join('');
 return h}
function staffView(){
 if(!isAdmin())return '';
 const reg=[...D.staff].sort((a,b)=>stTitle(a).localeCompare(stTitle(b))||(a.full_name||'').localeCompare(b.full_name||'')),cnt=id=>(D.asg||[]).filter(a=>a.staff_id===id).length;
 let h=`<h2 style="margin-top:0">Staff</h2><div class="card"><h3>Doctors, midwives and nurses</h3><div class="mu" style="margin-bottom:8px">Only you create these accounts. Enter their details and a temporary password, then give them their email and password.</div><button class="btn" onclick="createStaffModal()">${ic('plus')} Create staff account</button></div>`;
 h+=reg.map(s=>`<div class="card" ${s.active===false?'style="opacity:.6"':''}><div class="row" style="justify-content:space-between;align-items:center"><b>${esc(s.full_name)}</b><span class="row"><span class="pill">${stTitle(s)}</span>${s.active===false?'<span class="pill hot">Inactive</span>':''}</span></div><div class="mu">${esc(s.email)} \u00b7 ${cnt(s.id)} patient${cnt(s.id)===1?'':'s'}</div><div class="mu">${[s.phone,s.qualification,s.professional_reg_no?'Reg. '+s.professional_reg_no:'',s.years_experience!=null?s.years_experience+' yr'+(s.years_experience===1?'':'s')+' experience':''].filter(Boolean).map(esc).join(' \u00b7 ')||'No extra details yet'}</div>${s.id===me.id?'<div class="mu">This is you, the administrator.</div><div class="row" style="margin-top:8px"><button class="btn g" onclick="detailsModal(\''+s.id+'\')">'+ic('edit')+' Details</button></div>':`<div class="row" style="margin-top:8px"><button class="btn" onclick="assignPatientsModal('${s.id}')">Assign patients</button><button class="btn g" onclick="detailsModal('${s.id}')">${ic('edit')} Details</button>${stTitle(s)!=='Nurse'?`<button class="btn g" onclick="scheduleModal('${s.id}')">${ic('cal')} Set schedule</button>`:''}<button class="btn g" onclick="resetPwModal('${s.id}')">Reset password</button><button class="btn g" onclick="roleModal('${s.id}')">Change role</button><button class="btn g" onclick="setActive('${s.id}',${s.active===false})">${s.active===false?'Reactivate':'Deactivate'}</button></div>`}</div>`).join('')||'<div class="mu">No staff have registered yet.</div>';
  return h}
function assignView(){
 if(!isAdmin())return '';
 const sel=(p,title)=>{const cur=teamOf(p.id).find(s=>stTitle(s)===title);return `<select onchange="assign('${p.id}','${title}',this.value)"><option value="">${title}: none</option>${activeStaff(title).map(s=>`<option value="${s.id}"${cur&&cur.id===s.id?' selected':''}>${esc(s.full_name)}</option>`).join('')}</select>`};
 const rows=D.pts.filter(p=>!aUn||!teamOf(p.id).length).map(p=>`<div class="card asr" data-q="${esc((p.full_name+' '+p.patient_code).toLowerCase())}"><div class="row" style="justify-content:space-between"><b>${esc(p.full_name)}</b><span class="mu">${esc(p.patient_code)}${p.lmp&&p.status==='antenatal'?' \u00b7 Week '+wk(p):''}</span></div><div class="grid" style="margin-top:8px">${['Doctor','Midwife','Nurse'].map(t=>sel(p,t)).join('')}</div></div>`).join('');
  const note='';
 return `<h2 style="margin-top:0">Assignments</h2>${note}<div class="row" style="margin-bottom:10px"><input placeholder="Search patients" oninput="filtA(this.value)"><button class="btn ${aUn?'':'g'}" onclick="aUn=!aUn;drawDoc()">${aUn?'Showing unassigned only':'Show unassigned only'}</button></div>${rows||'<div class="mu">No patients to show.</div>'}`}
const filtA=q=>{q=q.toLowerCase();document.querySelectorAll('.asr').forEach(r=>r.style.display=r.dataset.q.includes(q)?'':'none')};
async function assign(pid,title,sid){const {error}=await sb.rpc('assign_staff',{p_patient:pid,p_title:title,p_staff:sid||null});if(error)alert(friendly(error));await loadDoc()}
function assignPatientsModal(sid){
 const s=D.staff.find(x=>x.id===sid);if(!s)return;const title=stTitle(s),cur=new Set((D.asg||[]).filter(a=>a.staff_id===sid).map(a=>a.patient_id));
 const rows=D.pts.map(p=>`<label class="ck" data-q="${esc((p.full_name+' '+p.patient_code).toLowerCase())}"><input type="checkbox" name="p_${p.id}" ${cur.has(p.id)?'checked':''}> <span>${esc(p.full_name)} <span class="mu">${esc(p.patient_code)}${teamOf(p.id).some(x=>stTitle(x)===title&&x.id!==sid)?' \u00b7 has another '+title.toLowerCase():''}</span></span></label>`).join('');
 modal('Assign patients \u00b7 '+esc(s.full_name),`<div class="mu" style="margin-bottom:6px">Each patient has one ${title.toLowerCase()}. Ticking a patient replaces their current ${title.toLowerCase()}.</div><input placeholder="Search" oninput="document.querySelectorAll('.md label[data-q]').forEach(l=>l.style.display=l.dataset.q.includes(this.value.toLowerCase())?'':'none')" style="margin-bottom:8px">${rows||'<div class="mu">No patients yet.</div>'}`,async f=>{
  for(const p of D.pts){const want=('p_'+p.id) in f,had=cur.has(p.id);if(want===had)continue;const {error}=await sb.rpc('assign_staff',{p_patient:p.id,p_title:title,p_staff:want?sid:null});if(error)throw error}
  await loadDoc()})}
function teamModal(pid){
 const p=P(pid);if(!p)return;const sel=t=>{const cur=teamOf(pid).find(s=>stTitle(s)===t);return `<label class="l">${t}</label><select name="${t}"><option value="">None</option>${activeStaff(t).map(s=>`<option value="${s.id}"${cur&&cur.id===s.id?' selected':''}>${esc(s.full_name)}</option>`).join('')}</select>`};
 modal('Care team \u00b7 '+esc(p.full_name),['Doctor','Midwife','Nurse'].map(sel).join(''),async f=>{
  for(const t of ['Doctor','Midwife','Nurse']){const cur=teamOf(pid).find(s=>stTitle(s)===t),want=f[t]||null;if((cur?cur.id:null)===want)continue;const {error}=await sb.rpc('assign_staff',{p_patient:pid,p_title:t,p_staff:want});if(error)throw error}
  await loadDoc()})}
function roleModal(sid){
 const s=D.staff.find(x=>x.id===sid);if(!s)return;
 modal('Change role \u00b7 '+esc(s.full_name),`<label class="l">Role</label><select name="t">${['Doctor','Midwife','Nurse'].map(t=>`<option${stTitle(s)===t?' selected':''}>${t}</option>`).join('')}</select><div class="mu" style="margin-top:6px">Their current patient assignments are cleared when the role changes. Assign patients again afterwards.</div>`,async f=>{
  if(f.t===stTitle(s))return;const a=await sb.from('profiles').update({staff_title:f.t}).eq('id',sid);if(a.error)throw a.error;
  await sb.from('staff_emails').update({title:f.t}).eq('email',s.email);await sb.from('patient_assignments').delete().eq('staff_id',sid);await loadDoc()})}
async function setActive(id,active){const s=D.staff.find(x=>x.id===id);if(!s)return;if(!confirm(active?'Reactivate '+s.full_name+'?':'Deactivate '+s.full_name+'? They will lose access straight away.'))return;const {error}=await sb.from('profiles').update({active}).eq('id',id);if(error)return alert(friendly(error));await loadDoc()}
/* ---------- staff working hours and leave (availability) ---------- */
const DOWN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
async function scheduleModal(sid){
 const s=D.staff.find(x=>x.id===sid);if(!s)return;
 const [{data:hrs},{data:lv}]=await Promise.all([sb.from('staff_hours').select('*').eq('staff_id',sid).order('dow').order('start_time'),sb.from('staff_leave').select('*').eq('staff_id',sid).order('start_date')]);
 const rows=(hrs||[]).map(h=>`<div class="li" data-h="${h.id}"><div>${DOWN[h.dow]} \u00b7 ${ft(h.start_time)}\u2013${ft(h.end_time)}</div><button type="button" class="ib" onclick="rmHours('${h.id}','${sid}')">${ic('x')}</button></div>`).join('')||'<div class="mu">No fixed hours set \u2014 treated as available every day, all day.</div>';
 const lvRows=(lv||[]).map(l=>`<div class="li" data-l="${l.id}"><div>${fd(l.start_date)}${l.end_date!==l.start_date?' \u2013 '+fd(l.end_date):''}${l.note?' \u00b7 '+esc(l.note):''}</div><button type="button" class="ib" onclick="rmLeave('${l.id}','${sid}')">${ic('x')}</button></div>`).join('')||'<div class="mu">No leave or time off recorded.</div>';
 modal('Schedule \u00b7 '+esc(s.full_name),`<h3>Weekly working hours</h3><div class="mu" style="margin-bottom:6px">Patients can only book inside these hours. Leave empty for always available.</div><div id="hrsList">${rows}</div><div class="row" style="margin-top:8px"><select id="hDow">${DOWN.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><input id="hFrom" type="time" value="08:00"><input id="hTo" type="time" value="17:00"><button type="button" class="btn g" onclick="addHours('${sid}')">${ic('plus')} Add</button></div>
 <h3 style="margin-top:16px">Leave / time off</h3><div id="lvList">${lvRows}</div><div class="row" style="margin-top:8px"><input id="lFrom" type="date"><input id="lTo" type="date"><input id="lNote" placeholder="Reason (optional)"><button type="button" class="btn g" onclick="addLeave('${sid}')">${ic('plus')} Add</button></div>`,
 async()=>{},'Done')}
async function addHours(sid){
 const dow=+$('hDow').value,from=$('hFrom').value,to=$('hTo').value;if(!from||!to||from>=to)return alert('Choose a valid time range.');
 const {error}=await sb.from('staff_hours').insert({staff_id:sid,dow,start_time:from,end_time:to});if(error)return alert(friendly(error));scheduleModal(sid)}
async function rmHours(id,sid){await sb.from('staff_hours').delete().eq('id',id);scheduleModal(sid)}
async function addLeave(sid){
 const from=$('lFrom').value,to=$('lTo').value||from;if(!from)return alert('Choose a start date.');if(to<from)return alert('End date cannot be before the start date.');
 const {error}=await sb.from('staff_leave').insert({staff_id:sid,start_date:from,end_date:to,note:nz($('lNote').value.trim())});if(error)return alert(friendly(error));scheduleModal(sid)}
async function rmLeave(id,sid){await sb.from('staff_leave').delete().eq('id',id);scheduleModal(sid)}
/* ---------- risk radar: combines existing signals into one priority per patient ---------- */
const RISK_LB={critical:'Critical',priority:'Priority',watch:'Watch'};
function riskOf(p){
 const reasons=[];
 const activeAlert=(D.al||[]).some(a=>a.patient_id===p.id&&a.level==='EMERGENCY'&&!a.acknowledged);
 if(activeAlert)reasons.push('Unresolved emergency alert from the patient');
 const activeAmb=(D.amb||[]).some(a=>a.patient_id===p.id&&['requested','dispatched'].includes(a.status));
 if(activeAmb)reasons.push('Active ambulance request');
 const v=lastV(p.id);(v?flags(v):[]).forEach(f=>reasons.push(f+(v.visit_date===today()?'':' (visit of '+fd(v.visit_date)+')')));
 if(p.admitted_at)reasons.push('Currently admitted');
 const missed=(D.ap||[]).filter(a=>a.patient_id===p.id&&a.status==='missed').length;
 if(missed>=2)reasons.push(missed+' missed appointments');
 if((p.gravida||0)>=5)reasons.push('Grand multipara (gravida '+p.gravida+')');
 if(p.dob){const age=ageOf(p);if(age!=='-'&&(age<18||age>35))reasons.push('Age '+age+(age<18?' \u2013 adolescent pregnancy':' \u2013 advanced maternal age'))}
 let level='normal';
 if(activeAlert||activeAmb)level='critical';else if(reasons.length>=2||p.admitted_at)level='priority';else if(reasons.length===1)level='watch';
 return {level,reasons}}
function riskPill(p){const r=riskOf(p);if(r.level==='normal')return '';
 return `<span class="pill hot" style="cursor:help" title="${esc(r.reasons.join('. '))}" onclick="event.stopPropagation();alert(${JSON.stringify(RISK_LB[r.level]+' \u2013 '+p.full_name+'\n\n')}+[${r.reasons.map(x=>JSON.stringify('\u2022 '+x)).join(',')}].join('\n'))">${RISK_LB[r.level]}</span>`}
const riskRank={critical:3,priority:2,watch:1,normal:0};
function detailsModal(sid){
 const s=D.staff.find(x=>x.id===sid);if(!s)return;
 modal('Details \u00b7 '+esc(s.full_name),`${fld('Phone','phone','tel',s.phone||'')}${fld('Qualification (e.g. MBChB, SRN, Diploma in Midwifery)','qualification','text',s.qualification||'')}${fld('Professional registration number','professional_reg_no','text',s.professional_reg_no||'')}${fld('Years of experience','years_experience','number',s.years_experience??'','min="0" max="60"')}`,async f=>{
  const {error}=await sb.from('profiles').update({phone:nz(f.phone),qualification:nz(f.qualification),professional_reg_no:nz(f.professional_reg_no),years_experience:f.years_experience===''?null:Math.round(+f.years_experience)}).eq('id',sid);
  if(error)throw error;await loadDoc()})}
function makeStaffModal(pid){
 const p=D.pts.find(x=>x.id===pid);if(!p)return;
 modal('Make staff \\u00b7 '+esc(p.full_name),`<div class="mu" style="margin-bottom:8px">Turns this patient's account into a staff account. Their patient record is kept, but they will log in as staff from now on and will need to be re-assigned to a care team.</div><label class="l">Role</label><select name="title"><option>Doctor</option><option>Midwife</option><option>Nurse</option></select>`,async f=>{
  if(!confirm('Make '+p.full_name+' a '+f.title+' now?'))return;
  const {error}=await sb.rpc('promote_to_staff',{p_patient:pid,p_title:f.title});if(error)throw error;
  toast(p.full_name+' is now a '+f.title+'.');await loadDoc()},'Make staff')}
async function callStaffAdmin(body){
 const {data,error}=await sb.functions.invoke('staff-admin',{body});
 if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}throw new Error(m)}
 if(data&&data.error)throw new Error(data.error);return data}
const genPw=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let p='';const a=new Uint32Array(10);crypto.getRandomValues(a);a.forEach(n=>p+=c[n%c.length]);return p};
function createStaffModal(){
 modal('Create staff account',`<label class="l">Role</label><select name="title"><option>Doctor</option><option>Midwife</option><option>Nurse</option></select>${fld('Full name','full_name','text','','required maxlength="120"')}${fld('Email','email','email','','required')}<label class="l">Temporary password (share it with them)</label><input name="password" type="text" required minlength="8" maxlength="72" value="${genPw()}">${fld('Phone','phone','tel','','maxlength="30"')}${fld('Qualification (e.g. MBChB, SRN, Diploma in Midwifery)','qualification','text','','maxlength="200"')}${fld('Professional registration number','professional_reg_no','text','','maxlength="60"')}${fld('Years of experience','years_experience','number','','min="0" max="60"')}`,async f=>{
  await callStaffAdmin({action:'create',...f});
  toast('Account created for '+f.full_name+'. Give them the email and temporary password.');await loadDoc()},'Create account')}
function resetPwModal(sid){
 const s=D.staff.find(x=>x.id===sid);if(!s)return;
 modal('Reset password \u00b7 '+esc(s.full_name),`<div class="mu" style="margin-bottom:6px">Sets a new temporary password. Share it with them privately.</div><label class="l">New temporary password</label><input name="password" type="text" required minlength="8" maxlength="72" value="${genPw()}">`,async f=>{
  await callStaffAdmin({action:'reset_password',user_id:sid,password:f.password});toast('Password reset for '+s.full_name+'.')},'Reset password')}
function changePwModal(){
 modal('Change my password',`<label class="l">New password (8 or more characters)</label><input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password">`,async f=>{
  const {error}=await sb.auth.updateUser({password:f.password});if(error)throw error;toast('Password changed.')},'Change password')}
boot();
