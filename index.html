/* ===== v3 clean design: neutral surfaces, navy primary, green as accent ===== */
body{background:var(--bg);letter-spacing:0}
h1,h2,h3{text-transform:none;letter-spacing:-.01em;font-weight:700}h1{font-size:26px}h2{font-size:19px;margin:22px 0 10px}h3{font-size:15px;color:var(--tx);font-weight:600}
.brand,.mh{text-transform:none;letter-spacing:0;font-weight:700}
.card,.st,.portion{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:none}.pr,.li{border-radius:12px;box-shadow:none}
.card{padding:16px}.portion{padding:16px;border-color:var(--bd)}
.portion>.ph{font:700 12px 'Inter',system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin:0 0 12px}.portion>.ph svg{background:none;color:var(--mu);padding:0;width:16px;height:16px}
.st.click>svg{background:none;color:var(--al);padding:0;width:18px;height:18px}.st b{font-weight:700;letter-spacing:-.02em}
.st.click:hover{transform:none;border-color:var(--ac)}.st{transition:border-color .12s}
.st.warn{background:var(--card);border-color:var(--bd);box-shadow:inset 3px 0 0 var(--rs)}.st.warn.click>svg{background:none;color:var(--rs)}
.btn{border-radius:10px;background:var(--ac);box-shadow:none;font-weight:600}.btn:hover{background:var(--ah);filter:none}.btn:active{transform:none}
.btn.g{background:transparent;box-shadow:none;border:1px solid var(--bd);color:var(--tx)}.btn.g:hover{background:var(--in);border-color:var(--mu);filter:none}
input,select,textarea,.f{border-radius:10px}input:focus,select:focus,textarea:focus,.f:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.pill{border-radius:99px;font-weight:600}.pill.hot{background:var(--rs);border-color:var(--rs);color:#fff}.pill.ok{background:color-mix(in srgb,var(--gr) 16%,transparent);border-color:var(--gr);color:var(--gr)}
.fl{color:var(--rs)}.fl svg{color:var(--rs)}
.auth{border-top:1px solid var(--bd);border-radius:18px;box-shadow:0 10px 36px rgba(16,24,40,.10)}.auth::before{display:none}
.side{background:var(--card);border-right:1px solid var(--bd)}

const daysAgo=d=>Math.floor((new Date(today()+'T00:00:00')-new Date(d+'T00:00:00'))/864e5);

 const w=p.lmp?wk(p):null,gap=w==null||w<28?28:w<=36?14:7;
 if(!v){const reg=p.created_at?daysAgo(p.created_at.slice(0,10)):0;return reg>=14?{days:reg,text:'No antenatal visit recorded since registration '+reg+' days ago'}:null}
 if(v.next_appointment){if(v.next_appointment>=t)return null;const od=daysAgo(v.next_appointment);return {days:od,text:'Appointment of '+fd(v.next_appointment)+' passed '+od+' day(s) ago with no visit recorded'}}

function medAlerts(){const out=[],t=today();

  if(ante&&v){flags(v).forEach(f=>add(p,'comp',/^Severe|^Fetal heart rate/.test(f)?3:2,f,'Visit of '+fd(v.visit_date)));
   const gl=(v.urine_glucose||'').toLowerCase();if(gl&&!/^(neg|nil|-|0|trace)/.test(gl))add(p,'comp',2,'Glucose in urine ('+v.urine_glucose+')','Screen for gestational diabetes \u00b7 visit of '+fd(v.visit_date));
   if(v.fundal_height_cm&&w&&w>=24&&Math.abs(v.fundal_height_cm-w)>(TH('fundal_mismatch_cm').high??3))add(p,'comp',2,'Fundal height '+v.fundal_height_cm+' cm does not match week '+w,'Possible growth problem \u00b7 visit of '+fd(v.visit_date))}

  (D.al||[]).filter(a=>a.patient_id===p.id&&!a.acknowledged).forEach(a=>add(p,'warn',3,'Unresolved emergency alert ('+a.level+')',(a.symptoms||[]).join(', ')+' \u00b7 '+new Date(a.created_at).toLocaleString()));
  (D.amb||[]).filter(a=>a.patient_id===p.id&&['requested','dispatched'].includes(a.status)).forEach(a=>add(p,'warn',3,'Active ambulance request ('+a.status+')',a.address||''));

  else if(ante&&p.lmp){const left=Math.round((new Date(p.lmp+'T00:00:00').getTime()+280*864e5-Date.now())/864e5);if(left>=0&&left<=7)add(p,'warn',1,'Due within '+left+' day(s)','Expected delivery '+due(p))}

function lineChart(o){
 const pts=(o.series||[]).map(se=>({...se,p:se.p.filter(q=>q.y!=null&&!isNaN(q.y))}));

 const grid=[0,.5,1].map(k=>{const v=y0+(y1-y0)*k;return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="var(--mu)">${f(v)}</text>`}).join('');

 (D.acap||[]).filter(a=>OK.includes(a.status)).forEach(a=>L.push({src:'appt',id:a.id,pid:a.patient_id,date:a.appt_date,cat:'Appointment fees',desc:(a.kind||'Appointment')+((a.fee_items||[]).length?' ('+a.fee_items.map(k=>FEE_NAMES[k]||k).join(', ')+')':''),amt:Number(a.fee_usd),paid:!!a.fee_paid,at:a.fee_paid_at,method:a.fee_paid_method}));
 (D.chg||[]).filter(c=>!c.voided).forEach(c=>L.push({src:'chg',id:c.id,pid:c.patient_id,date:c.charged_on,cat:CAT_LB[c.category]||'Other',desc:c.item_name+' x '+c.qty,amt:Number(c.total),paid:!!c.paid,at:c.paid_at,method:c.paid_method,stay:true}));
 (D.amb||[]).filter(a=>a.status!=='cancelled'&&Number(a.fee_usd)>0).forEach(a=>L.push({src:'amb',id:a.id,pid:a.patient_id,date:(a.requested_at||'').slice(0,10),cat:'Ambulance',desc:'Ambulance call-out',amt:Number(a.fee_usd),paid:!!a.paid}));
 return L.sort((x,y)=>(y.date||'').localeCompare(x.date||''))}
function inPeriod(d){const t=today();if(acp==='all')return true;if(acp==='today')return d===t;if(acp==='week')return d>=addD(t,-6);if(acp==='month')return (d||'').slice(0,7)===t.slice(0,7);return d>=addD(t,-29)}

/* ---------- risk radar: combines existing signals into one priority per patient ---------- */
const RISK_LB={critical:'Critical',priority:'Priority',watch:'Watch'};
function riskOf(p){
 const reasons=[];
 const activeAlert=(D.al||[]).some(a=>a.patient_id===p.id&&a.level==='EMERGENCY'&&!a.acknowledged);
 if(activeAlert)reasons.push('Unresolved emergency alert from the patient');
 const activeAmb=(D.amb||[]).some(a=>a.patient_id===p.id&&['requested','dispatched'].includes(a.status));
 if(activeAmb)reasons.push('Active ambulance request');
 const v=lastV(p.id);(v?flags(v):[]).forEach(f=>reasons.push(f+(v.visit_date===today()?'':' (visit of '+fd(v.visit_date)+')')));
 if(p.admitted_at)reasons.push('Currently admitted');
 const pa=pregAct(p.id);if(pa&&pa.risk_level==='high')reasons.push('Clinician-assessed high risk'+((pa.risk_factors||[]).length?': '+pa.risk_factors.join(', '):''));else if(pa&&pa.risk_level==='moderate')reasons.push('Clinician-assessed moderate risk'+((pa.risk_factors||[]).length?': '+pa.risk_factors.join(', '):''));
 const missed=(D.ap||[]).filter(a=>a.patient_id===p.id&&a.status==='missed').length;
 if(missed>=2)reasons.push(missed+' missed appointments');
 if((p.gravida||0)>=5)reasons.push('Grand multipara (gravida '+p.gravida+')');
 if(p.dob){const age=ageOf(p);if(age!=='-'&&(age<18||age>35))reasons.push('Age '+age+(age<18?' \u2013 adolescent pregnancy':' \u2013 advanced maternal age'))}
 let level='normal';
 if(activeAlert||activeAmb)level='critical';else if(reasons.length>=2||p.admitted_at||(pa&&pa.risk_level==='high'))level='priority';else if(reasons.length===1)level='watch';
 return {level,reasons}}
function riskPill(p){const r=riskOf(p);if(r.level==='normal')return '';
 return `<span class="pill hot" style="cursor:help" title="${esc(r.reasons.join('. '))}" onclick="event.stopPropagation();alert(${JSON.stringify(RISK_LB[r.level]+' \u2013 '+p.full_name+'\n\n')}+[${r.reasons.map(x=>JSON.stringify('\u2022 '+x)).join(',')}].join('\n'))">${RISK_LB[r.level]}</span>`}
const riskRank={critical:3,priority:2,watch:1,normal:0};

async function callStaffAdmin(body){
 const {data,error}=await sb.functions.invoke('staff-admin',{body});
 if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(e){}throw new Error(m)}
 if(data&&data.error)throw new Error(data.error);return data}
const genPw=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let p='';const a=new Uint32Array(10);crypto.getRandomValues(a);a.forEach(n=>p+=c[n%c.length]);return p};
function createStaffModal(){
 modal('Create staff account',`<label class="l">Role</label><select name="title"><option>Doctor</option><option>Midwife</option><option>Nurse</option></select>${fld('Full name','full_name','text','','required maxlength="120"')}${fld('Email','email','email','','required')}<label class="l">Temporary password (share it with them)</label><input name="password" type="text" required minlength="8" maxlength="72" value="${genPw()}">${fld('Phone','phone','tel','','maxlength="30"')}${fld('Qualification (e.g. MBChB, SRN, Diploma in Midwifery)','qualification','text','','maxlength="200"')}${fld('Professional registration number','professional_reg_no','text','','maxlength="60"')}${fld('Years of experience','years_experience','number','','min="0" max="60"')}`,async f=>{
  await callStaffAdmin({action:'create',...f});
  toast('Account created for '+f.full_name+'. Give them the email and temporary password.');await loadDoc()},'Create account')}
function resetPwModal(sid){
 const s=D.staff.find(x=>x.id===sid);if(!s)return;
 modal('Reset password \u00b7 '+esc(s.full_name),`<div class="mu" style="margin-bottom:6px">Sets a new temporary password. Share it with them privately.</div><label class="l">New temporary password</label><input name="password" type="text" required minlength="8" maxlength="72" value="${genPw()}">`,async f=>{
  await callStaffAdmin({action:'reset_password',user_id:sid,password:f.password});toast('Password reset for '+s.full_name+'.')},'Reset password')}
function changePwModal(){
 modal('Change my password',`<label class="l">New password (8 or more characters)</label><input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password">`,async f=>{
  const {error}=await sb.auth.updateUser({password:f.password});if(error)throw error;toast('Password changed.')},'Change password')}
boot();
</script></body></html>
