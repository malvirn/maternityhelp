<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accounts | Maternity Help</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0d1117">
<link rel="icon" type="image/png" href="/icons/icon-64.png">
<script>(function(){try{var m=localStorage.getItem("themeMode")||localStorage.getItem("theme")||"system";var t=m==="light"||m==="dark"?m:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}})()</script>
<style>
:root{
  --bg:#0d1117; --surface:#161b22; --sunk:#0f141b; --ink:#e8ecf2; --muted:#8a94a6; --line:#262d38;
  --accent:#4672d0; --accent-ink:#FFFFFF; --ah:#3a5fb8; --al:#8fb2f5; --glow:#14203a;
  --pos:#3fbf8a; --neg:#f0628f; --warn:#e0a84a; --info:#8fb2f5; --plum:#b59ad4;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r:10px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#f1f3f6; --ink:#111827; --muted:#6b7280; --line:#e2e6ec;
  --accent:#26467f; --accent-ink:#FFFFFF; --ah:#1c3562; --al:#26467f; --glow:#e6ecf7;
  --pos:#1f9d6b; --neg:#d93d6e; --warn:#9a6210; --info:#26467f; --plum:#7a5c99; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--sans);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0;line-height:1.25}
h1{font-size:1.3rem} h2{font-size:1rem} h3{font-size:.9rem}
a{color:var(--accent)}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.num{text-align:right;white-space:nowrap}
.hidden{display:none !important}

/* shell */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);color:var(--muted);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--sans);font-weight:700;font-size:1.05rem;color:var(--ink);padding:0 8px 16px;display:flex;flex-direction:column;gap:2px}
.brand small{display:block;font-family:var(--sans);font-size:.8rem;color:var(--muted);font-weight:400}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--r);color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--glow);color:var(--al);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.who{margin-top:auto;font-size:.85rem;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line)}
.who b{color:var(--ink);font-weight:600;display:block}
.nav a.back{color:var(--muted);padding:9px 12px;border-radius:var(--r);text-decoration:none;white-space:nowrap;font-weight:500}
.nav a.back:hover{background:var(--sunk);color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer}
main{min-width:0;padding:24px 28px 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;margin-bottom:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;overflow-x:auto;padding:10px;gap:2px;align-items:center}
  .brand{padding:0 10px 0 4px;white-space:nowrap;font-size:1rem}
  .brand small{display:none}
  .nav button{white-space:nowrap}
  .who{margin:0 0 0 auto;border:0;white-space:nowrap}
  .who b{display:none}
  main{padding:16px 14px 60px}
}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{color:var(--neg)}
.btn.small{padding:3px 9px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
input[type=date]{padding:6px 8px}
textarea{resize:vertical;min-height:60px;width:100%}
.linkbtn{color:var(--al)}
.lines input[list]{min-width:150px}
@media print{.nav,.toolbar,dialog{display:none!important}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
label.f > span{color:var(--muted);white-space:nowrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){ .g2,.g3,.g4{grid-template-columns:1fr} }
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel > h2,.panel > h3{margin-bottom:10px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c4{grid-column:span 4} .c5{grid-column:span 5} .c6{grid-column:span 6} .c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}
@media (max-width:1100px){ .c4,.c5,.c6,.c7,.c8{grid-column:span 12} }
.scroll{overflow-x:auto}

/* statement line: the dashboard's signature */
.statement{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 22px;padding:22px 24px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r)}
.statement .term{display:flex;flex-direction:column}
.statement .term span:first-child{color:var(--muted);font-size:.9rem}
.statement .amt{font-family:var(--serif);font-size:clamp(1.5rem,3.4vw,2.4rem);line-height:1.1}
.statement .op{font-family:var(--serif);font-size:clamp(1.3rem,3vw,2rem);color:var(--muted);padding-bottom:2px}
.statement .result .amt{font-weight:600}
.statement .range{flex-basis:100%;color:var(--muted);font-size:.85rem;margin-top:6px}

.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.figures > div{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.figures > div:nth-child(4n){border-right:0}
.figures > div:nth-last-child(-n+4){border-bottom:0}
.figures .k{color:var(--muted);font-size:.85rem}
.figures .v{font-size:1.25rem;font-weight:500;margin-top:2px}
.figures .s{font-size:.82rem;color:var(--muted)}
@media (max-width:900px){
  .figures{grid-template-columns:repeat(2,minmax(0,1fr))}
  .figures > div{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .figures > div:nth-child(2n){border-right:0}
  .figures > div:nth-last-child(-n+2){border-bottom:0}
}

/* tables */
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-weight:500;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.header td{font-weight:600}
tr.inactive td{color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:4px;white-space:nowrap}
.pill.ok{color:var(--pos);border-color:currentColor} .pill.bad{color:var(--neg);border-color:currentColor} .pill.mid{color:var(--warn);border-color:currentColor}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.list li:last-child{border-bottom:0}
.alert{padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);border-left-width:4px;margin-bottom:8px;background:var(--surface)}
.alert.critical{border-left-color:var(--neg)} .alert.warning{border-left-color:var(--warn)} .alert.info{border-left-color:var(--info)}
.alert b{display:block;font-weight:500}
.empty{color:var(--muted);padding:6px 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:500}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:300px}

/* journal line editor */
.lines{width:100%}
.lines td{border-bottom:0;padding:4px 4px}
.lines select,.lines input{width:100%}
.lines .amt{width:110px}
.diff{font-weight:500}

/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:var(--r);padding:0;width:min(860px,96vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(5,8,14,.6)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-body{padding:16px 18px;max-height:76vh;overflow:auto}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;padding:12px 14px;border-radius:var(--r);background:var(--ink);color:var(--bg);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--neg);color:#fff}
.login{max-width:400px;margin:10vh auto;padding:28px}
.gate{max-width:420px;width:calc(100% - 32px);margin:12vh auto;padding:32px 24px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.gate img{width:72px;height:72px;border-radius:16px;object-fit:contain}
.gate h1{margin:14px 0 6px}.gate p{margin:0 0 18px;color:var(--muted)}
.gate .btn{width:100%;padding:12px 16px;font-weight:600}.gate .foot{margin:16px 0 0;font-size:.88rem}
.gate .why{text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 18px;font-size:.9rem;color:var(--muted)}.gate .why b{display:block;color:var(--ink);margin-bottom:4px;font-size:.92rem}
.logohead{display:flex;justify-content:center;margin-bottom:10px}.logohead img{width:56px;height:56px;border-radius:12px;object-fit:contain}
.loading{color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div id="root"></div>
<dialog id="modal" aria-labelledby="modal-title">
  <div class="dlg-head"><h2 id="modal-title"></h2><button class="btn small" data-close type="button">Close</button></div>
  <div class="dlg-body" id="modal-body"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ---------- configuration ---------- */
const SUPABASE_URL = "https://swbvlpplhuezdlbzuuhh.supabase.co";
const SUPABASE_KEY = "sb_publishable_yNNbCu6kVC00rZ-qKzT0ew_JOK77dEZ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- state ---------- */
const S = {
  session: null, access: null, look: null, page: "dashboard", charts: {},
  dash: { preset: "month", from: null, to: null },
  gl: { tab: "ledger", from: null, to: null, account: "", type: "", source: "", search: "", offset: 0, asOf: null },
  jl: { from: null, to: null, type: "", search: "", offset: 0 },
  acc: { asOf: null },
  tx: { tab: "receipt" }
};
const PAGE = 200;

/* ---------- labels ---------- */
const METHOD = { cash: "Cash", bank: "Bank transfer", ecocash: "EcoCash", innbucks: "InnBucks", insurance: "Medical aid", other: "Other / not recorded" };
const ETYPE = { manual: "Manual", auto: "Automatic", document: "Document", opening: "Opening balance", closing: "Year-end closing", reversal: "Reversal" };
const SOURCE = { appointment: "Appointment", bed_charge: "Ward charge", ambulance: "Ambulance", receipt: "Receipt", refund: "Refund", invoice: "Invoice",
  bill: "Supplier bill", bill_payment: "Bill payment", expense: "Expense", manual: "Manual", opening: "Opening balances", period_close: "Period close" };
const TYPES = { asset: "Asset", liability: "Liability", equity: "Equity", revenue: "Revenue", expense: "Expense" };
const SUBTYPES = {
  asset: ["general","cash","bank","mobile_money","receivable_patient","receivable_insurance","receivable_other","inventory","prepayment","fixed_asset","contra_asset"],
  liability: ["general","payable_supplier","accrued","payroll_liability","tax_payable","patient_deposit","long_term_liability"],
  equity: ["general","capital","retained_earnings","opening_balance","drawings"],
  revenue: ["general","operating_revenue","other_income"],
  expense: ["general","operating_expense","depreciation","other_expense"]
};
const SUBLABEL = { general: "General", cash: "Cash", bank: "Bank", mobile_money: "Mobile money", receivable_patient: "Patient receivables (control)",
  receivable_insurance: "Medical aid receivable", receivable_other: "Other receivable", inventory: "Inventory", prepayment: "Prepayment", fixed_asset: "Equipment / fixed asset",
  contra_asset: "Contra asset (e.g. depreciation)", payable_supplier: "Supplier payables (control)", accrued: "Accrued expense", payroll_liability: "Payroll liability",
  tax_payable: "Tax payable", patient_deposit: "Patient deposits", long_term_liability: "Long-term liability", capital: "Capital", retained_earnings: "Retained earnings",
  opening_balance: "Opening balance equity", drawings: "Drawings", operating_revenue: "Operating revenue", other_income: "Other income",
  operating_expense: "Operating expense", depreciation: "Depreciation", other_expense: "Other expense" };
const MAPKIND = { fee_item: "Appointment fee item", appt_kind: "Appointment type", charge_category: "Ward charge category", ambulance: "Ambulance" };

/* ---------- helpers ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cur = () => (S.access && S.access.currency) || "USD";
function money(n) {
  return new Intl.NumberFormat("en-US", { style: "currency", currency: cur(), minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n || 0));
}
function amt(n) { const v = Number(n || 0); return v === 0 ? "" : money(v); }
function parseISO(s) { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function toISO(d) { return d.toISOString().slice(0, 10); }
function addDays(s, n) { const d = parseISO(s); d.setUTCDate(d.getUTCDate() + n); return toISO(d); }
function fd(s) { if (!s) return ""; const d = parseISO(s); return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }); }
function fdt(s) { if (!s) return ""; return new Date(s).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
function today() { return (S.access && S.access.today) || toISO(new Date()); }
function monthStart(s) { return s.slice(0, 8) + "01"; }
function newKey() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
}
const AMOUNT_RE = /^\d{1,12}(\.\d{1,2})?$/;
function cents(v) { const s = String(v || "").trim(); if (!s) return 0; if (!AMOUNT_RE.test(s)) return NaN; return Math.round(parseFloat(s) * 100); }
function role() { return S.access ? S.access.role : null; }
const canPost = () => ["accountant", "controller"].includes(role());
const isCtl = () => role() === "controller";
const isAdmin = () => !!(S.access && S.access.is_admin);

async function rpc(fn, args = {}) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message || "The request failed");
  return data;
}
let toastTimer;
function toast(msg, err = false) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "toast", err ? 6500 : 3500);
}
async function busy(btn, fn) {
  if (btn.disabled) return;
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Working…";
  try { await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; btn.textContent = label; }
}
function openModal(title, html) {
  $("#modal-title").textContent = title; $("#modal-body").innerHTML = html;
  const d = $("#modal"); if (!d.open) d.showModal();
  return $("#modal-body");
}
function closeModal() { const d = $("#modal"); if (d.open) d.close(); }
$("#modal").addEventListener("click", e => { if (e.target.matches("[data-close]") || e.target === $("#modal")) closeModal(); });

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function chart(id, cfg) {
  if (S.charts[id]) { S.charts[id].destroy(); delete S.charts[id]; }
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  Chart.defaults.font.family = cssVar("--sans"); Chart.defaults.color = cssVar("--muted"); Chart.defaults.borderColor = cssVar("--line");
  S.charts[id] = new Chart(el, cfg);
}
function destroyCharts() { Object.values(S.charts).forEach(c => c.destroy()); S.charts = {}; }

function opt(v, label, sel) { return `<option value="${esc(v)}"${String(v) === String(sel ?? "") ? " selected" : ""}>${esc(label)}</option>`; }
function accountOptions(filter, sel, blank = "Choose an account") {
  const list = (S.look ? S.look.accounts : []).filter(filter);
  return opt("", blank, sel) + list.map(a => opt(a.id, `${a.code}  ${a.name}`, sel)).join("");
}
const postable = a => !a.is_header && a.is_active;
const payFrom = a => postable(a) && ["cash", "bank", "mobile_money"].includes(a.subtype);
const costAcct = a => postable(a) && (a.type === "expense" || ["inventory", "prepayment", "fixed_asset"].includes(a.subtype));
function patientOptions(sel, blank = "Choose a patient") {
  return opt("", blank, sel) + (S.look ? S.look.patients : []).map(p => opt(p.id, p.name + (p.code ? ` (${p.code})` : ""), sel)).join("");
}
function supplierOptions(sel, onlyActive = true, blank = "Choose a supplier") {
  return opt("", blank, sel) + (S.look ? S.look.suppliers : []).filter(s => !onlyActive || s.is_active).map(s => opt(s.id, s.name, sel)).join("");
}
/* form field access by name that works in every browser and never collides with built-in form properties */
function form(el) {
  if (!el) return el;
  return new Proxy(el, { get(t, k) {
    const named = typeof k === "string" && t.elements ? t.elements.namedItem(k) : null;
    if (named) return named;
    const v = t[k]; return typeof v === "function" ? v.bind(t) : v;
  } });
}
function acctById(id) { return (S.look ? S.look.accounts : []).find(a => a.id === id); }
async function loadLookups() { S.look = await rpc("acc_lookups"); }

/* ---------- shell ---------- */
const NAV = [
  ["dashboard", "Dashboard"], ["invoices", "Invoices"], ["payments", "Payments"], ["expenses", "Expenses"], ["suppliers", "Suppliers"],
  ["ledger", "General ledger"], ["journal", "Journal entries"], ["accounts", "Chart of accounts"],
  ["periods", "Periods"], ["transactions", "Quick entry"], ["settings", "Settings"]
];
function renderShell() {
  const pages = NAV.filter(([k]) => k !== "transactions" || canPost());
  $("#root").innerHTML = `
  <div class="app">
    <nav class="nav" aria-label="Accounting">
      <div class="brand">Maternity Help<small>Accounts</small></div>
      ${pages.map(([k, l]) => `<button type="button" data-nav="${k}">${l}</button>`).join("")}
      <a class="back" href="/">Back to Maternity Help</a>

function rangeFor(preset) {
  const t = today(); const d = parseISO(t); const y = d.getUTCFullYear(), m = d.getUTCMonth();
  const fsm = ((S.look && S.look.settings && S.look.settings.fiscal_year_start_month) || 1) - 1;
  switch (preset) {
    case "day": return [t, t];
    case "week": { const s = addDays(t, -((d.getUTCDay() + 6) % 7)); return [s, addDays(s, 6)]; }
    case "month": return [toISO(new Date(Date.UTC(y, m, 1))), toISO(new Date(Date.UTC(y, m + 1, 0)))];
    case "quarter": { const q = Math.floor(m / 3) * 3; return [toISO(new Date(Date.UTC(y, q, 1))), toISO(new Date(Date.UTC(y, q + 3, 0)))]; }
    case "year": { const sy = m >= fsm ? y : y - 1; return [toISO(new Date(Date.UTC(sy, fsm, 1))), toISO(new Date(Date.UTC(sy + 1, fsm, 0)))]; }
    default: return [S.dash.from || t, S.dash.to || t];
  }
}

    <p class="muted" style="font-size:.85rem">Posted by ${esc(e.created_by || "Unknown")} on ${fdt(e.created_at)}.
      ${e.reversal_of ? ` Reverses <a href="#" data-goto="${e.reversal_of.id}">${esc(e.reversal_of.entry_no)}</a>.` : ""}
      ${e.reversed_by ? ` Reversed by <a href="#" data-goto="${e.reversed_by.id}">${esc(e.reversed_by.entry_no)}</a>: ${esc(e.reversal_reason || "")}.` : ""}</p>
    ${canRev ? `<form id="rev-form" class="panel" style="margin-top:12px" data-key="${newKey()}"><h3 style="margin-bottom:8px">Reverse this entry</h3>
      <p class="muted" style="margin-top:0">A reversal posts an equal and opposite entry. The original stays in the ledger.</p>
      <div class="grid g3"><label class="f c12" style="grid-column:span 2"><span>Reason</span><input name="reason" required minlength="3" maxlength="300"></label>
      <label class="f"><span>Reversal date</span><input type="date" name="date" value="${today() >= e.entry_date ? today() : e.entry_date}" min="${e.entry_date}" required></label></div>
      <div class="row" style="margin-top:10px"><button class="btn danger" type="submit">Reverse entry</button></div></form>` : ""}
    ${!e.reversible && ["appointment", "bed_charge", "ambulance"].includes(e.source_type) && e.status === "posted" && e.entry_type !== "reversal"
      ? `<p class="muted">This entry follows a Maternity Help record. To correct it, change or cancel the appointment, ward charge or ambulance request.</p>` : ""}`);
  $$("[data-goto]", body).forEach(a => a.addEventListener("click", ev => { ev.preventDefault(); showEntry(a.dataset.goto); }));

/* line editor shared by manual journals and opening balances */
function lineRow(filter) {
  return `<tr>
    <td><select data-f="account" aria-label="Account">${accountOptions(filter, "")}</select>
      <select data-f="patient" class="hidden" aria-label="Patient" style="margin-top:4px">${patientOptions("")}</select>

    <td><input data-f="credit" class="amt" inputmode="decimal" aria-label="Credit"></td>
    <td><button type="button" class="btn small" data-remove aria-label="Remove line">Remove</button></td></tr>`;
}
function journalForm(mode) {
  const opening = mode === "opening";
  const filter = opening ? (a => postable(a) && ["asset", "liability", "equity"].includes(a.type) && a.subtype !== "opening_balance") : postable;
  const body = openModal(opening ? "Opening balances" : "New journal entry", `
    <form id="je-form" data-key="${newKey()}">
      <div class="grid g3">
        <label class="f"><span>Date</span><input type="date" name="date" value="${today()}" required></label>
        <label class="f" style="grid-column:span 2"><span>Description</span><input name="description" required minlength="3" maxlength="500" value="${opening ? "Opening balances" : ""}"></label>
        ${opening ? "" : `<label class="f"><span>Reference (optional)</span><input name="reference" maxlength="120"></label>`}
      </div>
      ${opening ? `<p class="muted">Enter balances for asset, liability and equity accounts. Any difference is posted to Opening balance equity automatically.</p>` : ""}
      <div class="scroll" style="margin-top:12px"><table class="lines"><thead><tr><th>Account</th><th>Line description</th><th class="num">Debit</th><th class="num">Credit</th><th></th></tr></thead>
        <tbody id="je-lines">${lineRow(filter)}${opening ? "" : lineRow(filter)}</tbody>
        <tfoot><tr><td><button type="button" class="btn small" id="je-add">Add line</button></td><td class="num">Totals</td>
          <td class="num" id="je-dr">0.00</td><td class="num" id="je-cr">0.00</td><td></td></tr></tfoot></table></div>
      <p class="diff" id="je-diff"></p>
      <div class="row"><button class="btn primary" type="submit" id="je-post">${opening ? "Post opening balances" : "Post entry"}</button></div>
    </form>`);
  const f = form($("#je-form", body)), tb = $("#je-lines", body);
  const recalc = () => {
    let dr = 0, cr = 0, bad = false;
    $$("tr", tb).forEach(tr => {
      const d = cents($("[data-f=debit]", tr).value), c = cents($("[data-f=credit]", tr).value);
      if (Number.isNaN(d) || Number.isNaN(c)) bad = true; else { dr += d; cr += c; }
      const a = acctById($("[data-f=account]", tr).value);
      $("[data-f=patient]", tr).classList.toggle("hidden", !(a && a.subtype === "receivable_patient"));
      $("[data-f=supplier]", tr).classList.toggle("hidden", !(a && a.subtype === "payable_supplier"));
    });
    $("#je-dr", body).textContent = (dr / 100).toFixed(2); $("#je-cr", body).textContent = (cr / 100).toFixed(2);
    const diff = dr - cr, msg = $("#je-diff", body);
    if (bad) { msg.textContent = "Amounts must be numbers with up to two decimals."; msg.className = "diff neg"; }
    else if (opening) { msg.textContent = diff === 0 ? "Balanced." : `Difference of ${money(Math.abs(diff) / 100)} will go to Opening balance equity.`; msg.className = "diff muted"; }
    else { msg.textContent = diff === 0 && dr > 0 ? "Balanced." : `Debits and credits differ by ${money(Math.abs(diff) / 100)}.`; msg.className = "diff " + (diff === 0 && dr > 0 ? "pos" : "neg"); }
    if (!opening) $("#je-post", body).disabled = bad || diff !== 0 || dr === 0;
  };
  tb.addEventListener("input", recalc); tb.addEventListener("change", recalc);
  tb.addEventListener("click", ev => { if (ev.target.matches("[data-remove]")) { if ($$("tr", tb).length > 1) ev.target.closest("tr").remove(); recalc(); } });
  $("#je-add", body).addEventListener("click", () => { tb.insertAdjacentHTML("beforeend", lineRow(filter)); recalc(); });
  recalc();
  f.addEventListener("submit", ev => {
    ev.preventDefault();
    const lines = [];
    for (const tr of $$("tr", tb)) {
      const v = k => $(`[data-f=${k}]`, tr).value.trim();
      const a = acctById(v("account")); const d = v("debit"), c = v("credit");
      if (!a && !d && !c) continue;
      if (!a) return toast("Choose an account on every line", true);
      if ((d && c) || (!d && !c)) return toast(`Enter either a debit or a credit for ${a.code}`, true);
      if (!AMOUNT_RE.test(d || c) || cents(d || c) === 0) return toast(`Enter an amount above zero with up to two decimals for ${a.code}`, true);
      const line = { account_id: a.id, description: v("description") || null };
      if (d) line.debit = d; else line.credit = c;
      if (a.subtype === "receivable_patient") { if (!v("patient")) return toast(`Choose the patient for ${a.code}`, true); line.patient_id = v("patient"); }
      if (a.subtype === "payable_supplier") { if (!v("supplier")) return toast(`Choose the supplier for ${a.code}`, true); line.supplier_id = v("supplier"); }
      lines.push(line);
    }
    busy($("#je-post", body), async () => {
      const r = opening
        ? await rpc("acc_post_opening_balances", { p_date: f.date.value, p_lines: lines, p_idem: f.dataset.key, p_description: f.description.value.trim() })
        : await rpc("acc_post_journal", { p_date: f.date.value, p_description: f.description.value.trim(), p_reference: f.reference.value.trim() || null, p_lines: lines, p_idem: f.dataset.key });
      closeModal(); toast(`Posted ${r.entry_no}`); await loadLookups(); refreshAfterChange();
    });
  });
}

/* ---------- PDF documents (jsPDF) ---------- */
function pdfBuild(o) {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) throw new Error("The PDF tool could not load. Check your connection and try again.");
  const doc = new J({ unit: "pt", format: "a4" }), W = 595.28, H = 841.89, M = 40, CW = W - 2 * M;
  const ink = [17, 24, 39], mu = [107, 114, 128], ac = [38, 70, 127];
  let y = 0;
  const T = (t, x, yy, op) => doc.text(t, x, yy, op);
  const fit = (t, w) => doc.splitTextToSize(String(t == null || t === "" ? "-" : t), w);
  function head() {
    doc.setFillColor(...ac); doc.rect(0, 0, W, 8, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(...ink); T("Maternity Help", M, 44);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...mu); T("Hospital accounts", M, 58);
    doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(...ac); T(o.title.toUpperCase(), W - M, 44, { align: "right" });
    if (o.number) { doc.setFontSize(11); doc.setTextColor(...ink); T(o.number, W - M, 60, { align: "right" }); }
    doc.setDrawColor(226, 230, 236); doc.line(M, 72, W - M, 72); y = 92;
  }
  const need = h => { if (y + h > H - 60) { doc.addPage(); head(); } };
  head();
  const half = CW / 2, meta = o.meta || [];
  for (let i = 0; i < meta.length; i += 2) {
    const pair = [meta[i], meta[i + 1]].filter(Boolean);
    const rowH = Math.max(...pair.map(m => 14 + fit(m[1], half - 20).length * 13));
    need(rowH + 8);
    pair.forEach((m, j) => {
      const x = M + j * half;
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...mu); T(m[0], x, y);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...ink); T(fit(m[1], half - 20), x, y + 14);
    });
    y += rowH + 6;
  }
  y += 8;
  (o.tables || []).forEach(tb => {
    if (tb.title) { need(44); doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...ink); T(tb.title, M, y); y += 16; }
    const tot = tb.widths.reduce((a, b) => a + b, 0), w = tb.widths.map(x => x / tot * CW), xs = []; let acx = M;
    w.forEach((cw, i) => { xs[i] = acx; acx += cw; });
    const drawHead = () => {
      need(30); doc.setFillColor(241, 243, 246); doc.rect(M, y - 12, CW, 22, "F"); doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...mu);
      tb.head.forEach((h, i) => { const r = tb.align[i] === "r"; T(h, r ? xs[i] + w[i] - 5 : xs[i] + 5, y + 2, r ? { align: "right" } : undefined); }); y += 22;
    };
    drawHead();
    if (!tb.rows.length) { doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...mu); T(tb.empty || "Nothing to show.", M + 5, y + 2); y += 22; }
    tb.rows.forEach(r => {
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
      const cells = r.map((c, i) => fit(c, w[i] - 10)), h = Math.max(...cells.map(c => c.length)) * 12 + 10;

const FILE_OK = ["application/pdf", "image/png", "image/jpeg", "image/webp"];
async function uploadFiles(docType, docId, files) {
  let n = 0;
  for (const f of files) {
    if (!FILE_OK.includes(f.type)) throw new Error(`${f.name}: upload a PDF or an image (PNG, JPG or WebP)`);
    if (f.size > 8 * 1024 * 1024) throw new Error(`${f.name} is larger than 8 MB`);
    const path = `${docType}/${docId}/${Date.now()}-${f.name.replace(/[^\w.\-]+/g, "_").slice(-80)}`;
    const { error } = await sb.storage.from("acc-docs").upload(path, f, { contentType: f.type, upsert: false });
    if (error) throw new Error(error.message);
    await rpc("acc_add_attachment", { p_doc_type: docType, p_doc_id: docId, p_path: path, p_name: f.name, p_mime: f.type, p_size: f.size });
    n++;
  }
  return n;
}
async function openAttachment(path) {
  const { data, error } = await sb.storage.from("acc-docs").createSignedUrl(path, 120);
  if (error) throw new Error(error.message);
  window.open(data.signedUrl, "_blank");
}
const fileField = (label = "Receipt or supporting invoice (PDF or image, optional)") => `<label class="f" style="grid-column:1/-1"><span>${esc(label)}</span><input type="file" name="files" accept="application/pdf,image/png,image/jpeg,image/webp" multiple></label>`;

    ${canPost() ? `<form id="af" class="row"><input type="file" name="files" accept="application/pdf,image/png,image/jpeg,image/webp" multiple required><button class="btn primary" type="submit">Upload</button></form>` : ""}
    ${back ? `<div class="row"><button class="btn" id="att-back" type="button">Back</button></div>` : ""}</div>`);
  $$("[data-open]", body).forEach(b => b.addEventListener("click", () => openAttachment(b.dataset.open).catch(e => toast(e.message, true))));

    if (back) $("#bk", body).addEventListener("click", back); return;

    <div class="grid g3"><div><div class="muted">Received from</div><b>${esc(p.name || "")}</b><div class="muted">${esc(p.code || "")}</div></div>
      <div><div class="muted">Date</div><b>${fd(r.date)}</b><div class="muted">${esc(mlabel(r.method))}${r.reference ? " \u00b7 " + esc(r.reference) : ""}</div></div>
      <div><div class="muted">Status</div>${pill(r.status)}<div class="muted">${r.automatic ? "Recorded automatically" : "Recorded manually"}</div></div>
      <div><div class="muted">Amount</div><b style="font-size:1.2rem">${money(r.amount)}</b></div>
      <div><div class="muted">Invoice</div><b>${inv ? esc(inv.invoice_no) : "Patient credit"}</b>${inv ? `<div class="muted">Balance now ${money(inv.balance)}</div>` : ""}</div>
      <div><div class="muted">Received by</div><b>${esc(d.received_by || "")}</b></div></div>
    ${r.status === "reversed" ? `<p class="neg">Reversed${r.reversed_on ? " on " + fd(r.reversed_on) : ""}${r.reversal_reason ? ": " + esc(r.reversal_reason) : ""}</p>` : ""}
    <div class="row">${pdfButtons("rct")}${isCtl() && r.status === "posted" && !r.automatic ? `<button class="btn danger" id="rv" type="button">Reverse payment</button>` : ""}${back ? `<button class="btn" id="bk" type="button">Back</button>` : ""}</div>
    ${r.automatic && r.status === "posted" ? `<p class="muted">This payment came from a Maternity Help record, so change it there instead.</p>` : ""}</div>`);
  bindPdf(body, "rct", () => receiptPdf(d), `${r.receipt_no}.pdf`);
  const rv = $("#rv", body); if (rv) rv.addEventListener("click", () => reasonForm(`Reverse ${r.receipt_no}`, "The payment is reversed with a new accounting entry and the invoice balance goes back up. Nothing is deleted.", "Reverse payment",
    async reason => { await rpc("acc_reverse_payment", { p_kind: "receipt", p_id: id, p_reason: reason }); toast("Payment reversed"); closeModal(); refreshPage(); }, () => showReceipt(id, kind, row, back)));
  if (back) $("#bk", body).addEventListener("click", back);
}

    <div class="panel"><h2>Where automatic income is posted</h2>
      <p class="muted">Appointment fees use the first matching fee item, then the appointment type. Ward charges use their category. Anything unmatched goes to 4198 Other patient services.</p>
      <div class="scroll"><table><thead><tr><th>Source</th><th>Matches</th><th>Revenue account</th>${ctl ? "<th></th>" : ""}</tr></thead><tbody>
      ${S.look.revenue_map.map((m, i) => `<tr><td>${esc(MAPKIND[m.source_kind])}</td><td>${esc(m.match_value)}</td>
        <td>${ctl ? `<select data-map="${i}" aria-label="Account for ${esc(m.match_value)}">${accountOptions(revAcc, m.account_id)}</select>` : esc(m.account)}</td>
        ${ctl ? `<td class="num"><span class="row" style="justify-content:flex-end"><button class="btn small" data-map-save="${i}">Save</button><button class="btn small danger" data-map-del="${i}">Remove</button></span></td>` : ""}</tr>`).join("")}</tbody></table></div>
      ${ctl ? `<form class="row" id="map-add" style="margin-top:12px"><select name="kind" aria-label="Source">${Object.entries(MAPKIND).map(([k, v]) => opt(k, v, "fee_item")).join("")}</select>
        <input name="value" required maxlength="80" placeholder="e.g. anc" aria-label="Value to match"><select name="account" required aria-label="Revenue account">${accountOptions(revAcc, "")}</select>
        <button class="btn" type="submit">Add mapping</button></form>` : ""}</div>

    <div class="panel"><div class="panel-head"><h2>Automatic posting status</h2>${ctl ? `<button class="btn" id="resync" type="button">Re-sync all records</button>` : ""}</div>
      ${S.look.sync_errors.length ? `<div class="scroll"><table><thead><tr><th>Record</th><th>Problem</th><th>When</th></tr></thead><tbody>
        ${S.look.sync_errors.map(e => `<tr><td>${esc(SOURCE[e.source_type] || e.source_type)}<div class="muted" style="font-size:.8rem">${esc(e.source_id)}</div></td><td>${esc(e.error)}</td><td>${fdt(e.occurred_at)}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="empty">All Maternity Help records are posted.</p>`}
      <p class="muted" style="font-size:.88rem">Rules: an appointment fee is income once the visit is done or admitted, or once it is paid. A ward charge is income when added and is reversed if voided.
      An ambulance fee is income once dispatched, or once paid. Payments move the balance from the patient to the cash, bank, mobile money or medical aid account for the payment method.
      Cancelling or changing a record posts a reversal; nothing is deleted.</p></div>
  </div>`;
  $$("[data-save-user]").forEach(b => b.addEventListener("click", () => busy(b, async () => {
    const sel = $(`[data-user="${b.dataset.saveUser}"]`); await rpc("acc_set_user_role", { p_user: b.dataset.saveUser, p_role: sel.value || null }); toast("Access updated");
  })));
  const sf = form($("#set-form"));
  if (ctl) sf.addEventListener("submit", ev => { ev.preventDefault(); busy($("button[type=submit]", sf), async () => {
    await rpc("acc_update_settings", { p_payment_terms_days: Number(sf.terms.value), p_low_balance: sf.low.value, p_unusual: sf.unusual.value });
    toast("Settings saved"); await loadLookups(); }); });
  else sf.addEventListener("submit", ev => ev.preventDefault());
  $$("[data-map-save]").forEach(b => b.addEventListener("click", () => busy(b, async () => {
    const m = S.look.revenue_map[b.dataset.mapSave]; const acc = $(`[data-map="${b.dataset.mapSave}"]`).value;
    if (!acc) throw new Error("Choose a revenue account");
    await rpc("acc_set_revenue_map", { p_kind: m.source_kind, p_value: m.match_value, p_account: acc }); toast("Mapping saved");
  })));
  $$("[data-map-del]").forEach(b => b.addEventListener("click", () => {
    const m = S.look.revenue_map[b.dataset.mapDel]; if (!confirm(`Remove the mapping for "${m.match_value}"?`)) return;
    busy(b, async () => { await rpc("acc_set_revenue_map", { p_kind: m.source_kind, p_value: m.match_value, p_account: null }); toast("Mapping removed"); renderSettings(); });
  }));
  const ma = form($("#map-add"));
  if (ma) ma.addEventListener("submit", ev => { ev.preventDefault(); busy($("button", ma), async () => {
    await rpc("acc_set_revenue_map", { p_kind: ma.kind.value, p_value: ma.value.value.trim().toLowerCase(), p_account: ma.account.value }); toast("Mapping added"); renderSettings(); }); });
  const rs = $("#resync");
  if (rs) rs.addEventListener("click", () => busy(rs, async () => {
    const r = await rpc("acc_resync_all"); toast(r.failed ? `${r.failed} of ${r.processed} record(s) still failing` : `${r.processed} record(s) checked, all posted`, r.failed > 0); renderSettings();
  }));
}

/* ---------- sign-in + boot ---------- */
function renderGate() {
  destroyCharts();
  $("#root").innerHTML = `<div class="gate"><img src="/logo.png" alt="Maternity Help"><h1>Accounting</h1>
    <p>Invoices, payments, expenses, suppliers and the general ledger.</p>
    <div class="why"><b>Why is this hidden?</b>
      <span>Accounting holds patients' bills and payments and the hospital's money records. These are private, so we keep them out of sight and only let authorised staff in. You sign in first, and what you can do depends on the access you were given. This protects patients' information and stops accidental or unauthorised changes to the books.</span></div>
    <button class="btn primary" id="open-acc" type="button">Open accounting</button>
    <p class="foot"><a href="/">Back to Maternity Help</a></p></div>`;
  $("#open-acc").addEventListener("click", () => renderLogin());
}
function renderLogin(msg) {
  destroyCharts();
  $("#root").innerHTML = `<form class="panel login" id="login"><div class="logohead"><img src="/logo.png" alt=""></div><h1 style="margin-bottom:6px;text-align:center">Accounting login</h1>
    <p class="muted" style="margin-top:0">Sign in with your Maternity Help account.</p>
    ${msg ? `<p class="neg">${esc(msg)}</p>` : ""}
    <div class="grid"><label class="f"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
    <label class="f"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" id="login-back">Back</button></div>
    <p class="muted" style="font-size:.88rem;margin-bottom:0">Use Google to sign in? <a href="/">Open Maternity Help</a>, sign in there, then come back to this page.</p></form>`;
  const f = form($("#login"));
  $("#login-back").addEventListener("click", () => renderGate());
  setTimeout(() => { if (f.email) f.email.focus(); }, 30);
  f.addEventListener("submit", ev => { ev.preventDefault(); busy($("button", f), async () => {
    const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
    if (error) throw new Error(error.message);
  }); });
}
async function boot(session) {
  S.session = session;
  if (!session) return renderGate();
  try {
    S.access = await rpc("acc_my_access");
    if (!S.access.role) {
      $("#root").innerHTML = `<div class="panel login"><h1>No accounting access</h1><p class="muted">Your account cannot use accounting yet. Ask the administrator to give you access in Accounts, Settings.</p>
        <div class="row"><a class="btn" href="/" style="text-decoration:none">Back to Maternity Help</a><button class="btn" id="so" type="button">Sign out</button></div></div>`;
      $("#so").addEventListener("click", () => sb.auth.signOut()); return;
    }
    await loadLookups();
    renderShell(); go(S.page);
  } catch (e) { renderLogin(e.message); }
}
window.addEventListener("unhandledrejection", e => { toast((e.reason && e.reason.message) || "Something went wrong", true); });
let lastUser = null;
sb.auth.onAuthStateChange((event, session) => {
  const uid = session ? session.user.id : null;
  if (event === "TOKEN_REFRESHED" && uid === lastUser) return;
  if (event === "INITIAL_SESSION" || uid !== lastUser) { lastUser = uid; setTimeout(() => boot(session), 0); }
});
</script>
</body>
</html>
